[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai2-tango"
dynamic = ["version"]
readme = "README.md"
description = "A library for choreographing your machine learning research."
classifiers=[
  "Intended Audience :: Science/Research",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "Allen Institute for Artificial Intelligence", email = "contact@allenai.org"}
]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "cached-path>=1.0,<2.0",
  "rjsonnet>=0.5.0",
  "GitPython>=3.0,<4.0",
  "PyYAML>=5.4.1,<7.0",
  "dill",
  "base58",
  "xxhash",
  "filelock>=3.4",
  "click>=8.0",
  "click-help-colors>=0.9.1",
  "rich>=12.3",
  "tqdm>=4.62,<5.0",
  "more-itertools>=8.0",
  "sqlitedict",
  "petname>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy>=1.11",
  "types-PyYAML",
  "types-setuptools",
  "black>=24.0",
  "isort>=5.13",
  "pytest",
  "pytest-sphinx",
  "flaky",
  "twine>=1.11.0",
  "setuptools",
  "wheel",
  "build",
  "Sphinx>=7.2",
  "furo>=2024.1",
  "myst-parser>=2.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-autobuild>=2024.2",
  "sphinx-autodoc-typehints>=2.0",
  "packaging"
]
examples = [
  "torchmetrics>=0.7.0"
]
torch = [
  "torch>=2.1",
  "numpy",
]
transformers = [
  "torch>=2.1",
  "numpy",
  "datasets>=2.14",
  "transformers>=4.40",
  "sentencepiece>=0.2",
  "sacremoses"
]
datasets = [
  "datasets>=2.14"
]
hf = [
  # 1.26 is the floor actually verified to carry every symbol this integration uses:
  # the Jobs API, `Volume`, `sync_job_volume`, the whole bucket API, and Inference Endpoints.
  "huggingface_hub>=1.26",
  # Only for the step lock. The native bucket API has no conditional write, so the lock
  # goes through the S3 gateway at s3.hf.co, which honours `If-None-Match` on PutObject.
  "boto3",
]
all = [
  "ai2-tango[examples,torch,transformers,datasets,hf]"
]

[project.scripts]
tango = "tango.__main__:main"

[project.urls]
homepage = "https://github.com/anbasile/tango"
repository = "https://github.com/anbasile/tango"

[tool.setuptools.packages.find]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
    "test_fixtures",
    "test_fixtures.*",
    "docs*",
    "scripts*",
    "examples*"
]

[tool.setuptools.package-data]
tango = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "tango.version.VERSION"}

[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
(
      __pycache__
    | \.git
    | \.mypy_cache
    | \.pytest_cache
    | \.vscode
    | \.venv
    | \bdist\b
    | \bdoc\b
)
'''

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.ruff]
line-length = 115
exclude = [
  ".venv",
  ".git",
  "__pycache__",
  ".mypy_cache",
  "docs/build",
  "dist"
]

[tool.ruff.lint]
select = ["E"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/**/**/__init__.py" = ["F401","E501"]

[tool.mypy]
ignore_missing_imports = true
no_site_packages = false
# mypy 2.0 repurposed `allow_redefinition`; the semantics this codebase relies on
# (unconditional redefinition with a new type in the same block) are now `_old`.
allow_redefinition_old = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
strict_optional = false
disable_error_code = [
  "var-annotated",
  "no-redef",
  "dict-item"
]
allow_redefinition_old = true

[tool.pytest.ini_options]
testpaths = "tests/"
python_classes = [
  "Test*",
  "*Test"
]
log_format = "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
log_level = "DEBUG"
markers = [
  "gpu: marks tests that need GPUs"
]
filterwarnings = [
  'ignore::UserWarning:tango\.*',
]
doctest_optionflags = "NORMALIZE_WHITESPACE"
