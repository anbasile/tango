name: Docker

# Builds the image to prove the Dockerfile still works. Nothing is pushed anywhere.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"

jobs:
  build:
    name: Build (${{ matrix.build.tag }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build:
          - base_image: pytorch/pytorch:2.6.0-cuda12.4-cudnn9-runtime
            tag: cuda12.4
    env:
      IMAGE_NAME: tango
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --build-arg BASE_IMAGE=${{ matrix.build.base_image }} -t "${IMAGE_NAME}:${{ matrix.build.tag }}" .

      - name: Test Docker image
        run: |
          docker run --rm "${IMAGE_NAME}:${{ matrix.build.tag }}" info
